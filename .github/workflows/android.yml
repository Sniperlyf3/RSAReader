name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore RSAReader.csproj

      - name: Build APK
        run: dotnet publish RSAReader.csproj -f net9.0-android -c Debug -p:AndroidPackageFormats=apk -o artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RSAReader-apk
          path: artifacts/**/*.apk
          if-no-files-found: error
